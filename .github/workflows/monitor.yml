name: Monitoramento de Milhas

on:
  schedule:
    # Executa a cada 1 hora (no minuto 0)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite rodar manualmente a qualquer momento pela interface do GitHub

concurrency:
  group: milhas-monitor
  cancel-in-progress: false

jobs:
  check-promotions:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão necessária para commitar o histórico de promoções vistas

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes de integridade
        env:
          PYTHONPATH: .
        run: |
          python -m pytest

      - name: Executar bot de monitoramento
        env:
          PYTHONPATH: .
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.main

      - name: Salvar histórico de promoções vistas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_posts.json
          git commit -m "chore: update seen promotions [skip ci]" || echo "Sem novas promoções para registrar."
          git push
